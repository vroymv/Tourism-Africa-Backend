name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://localhost:3000' }}
  ECR_REPOSITORY: tourism-africa-api
  LAMBDA_FUNCTION: tourism-africa-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r dev-requirements.txt

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::602787432465:role/GitHubActionsTourismAfricaDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to Lambda
        env:
          LAMBDA_EXECUTION_ROLE: arn:aws:iam::602787432465:role/TourismAfricaLambdaExecution
        run: |
          set -euo pipefail
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          if aws lambda get-function --function-name "$LAMBDA_FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION" \
              --image-uri "$IMAGE_URI"
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          else
            aws lambda create-function \
              --function-name "$LAMBDA_FUNCTION" \
              --package-type Image \
              --code "ImageUri=$IMAGE_URI" \
              --role "$LAMBDA_EXECUTION_ROLE" \
              --architectures x86_64 \
              --memory-size 1024 \
              --timeout 30
            aws lambda wait function-active-v2 --function-name "$LAMBDA_FUNCTION"
          fi

          ENVIRONMENT=$(jq -cn --arg origins "$CORS_ORIGINS" \
            '{Variables: {CORS_ORIGINS: $origins}}')
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --environment "$ENVIRONMENT"
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"

      - name: Configure public function URL
        id: function-url
        run: |
          set -euo pipefail

          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION" \
            --query FunctionUrl --output text 2>/dev/null || \
            aws lambda create-function-url-config \
              --function-name "$LAMBDA_FUNCTION" \
              --auth-type NONE \
              --query FunctionUrl --output text)

          POLICY=$(aws lambda get-policy --function-name "$LAMBDA_FUNCTION" \
            --query Policy --output text 2>/dev/null || printf '{}')
          if ! jq -e '.Statement[]? | select(.Sid == "FunctionUrlAllowPublicAccess")' \
            <<< "$POLICY" >/dev/null; then
            aws lambda add-permission \
              --function-name "$LAMBDA_FUNCTION" \
              --statement-id FunctionUrlAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal '*' \
              --function-url-auth-type NONE
          fi

          POLICY=$(aws lambda get-policy --function-name "$LAMBDA_FUNCTION" \
            --query Policy --output text)
          if ! jq -e '.Statement[]? | select(.Sid == "FunctionUrlInvokeAllowPublicAccess")' \
            <<< "$POLICY" >/dev/null; then
            aws lambda add-permission \
              --function-name "$LAMBDA_FUNCTION" \
              --statement-id FunctionUrlInvokeAllowPublicAccess \
              --action lambda:InvokeFunction \
              --principal '*' \
              --invoked-via-function-url
          fi

          echo "url=$FUNCTION_URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$FUNCTION_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployment
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.function-url.outputs.url }}"
